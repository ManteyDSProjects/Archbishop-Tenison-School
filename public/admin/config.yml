backend:
  name: git-gateway
  branch: main

# Only takes effect on localhost: run `npx decap-server` next to `npm run dev`
# and open /admin to edit content on disk without logging in.
local_backend: true

# Netlify Identity handles auth. Enable Identity + Git Gateway on the
# Netlify site once deployed (Site configuration > Identity), then
# invite staff users from there.

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: simple

collections:
  - name: "news"
    label: "News Posts"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Order", name: "order", widget: "number", required: false }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Link (page, PDF or external URL)", name: "href", widget: "string", required: false }
      - { label: "Open link in new tab", name: "newTab", widget: "boolean", default: false, required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}} ({{section}})"
    media_folder: "/public/images/pages"
    public_folder: "/images/pages"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Web address (no spaces, lower case, e.g. school-uniform)",
          name: "slug",
          widget: "string",
          pattern: ["^[a-z0-9-]+$", "Lower case letters, numbers and hyphens only"],
        }
      - {
          label: "Menu section",
          name: "section",
          widget: "select",
          required: false,
          options:
            [
              "About Us",
              "Information",
              "Curriculum",
              "School Services",
              "Staff Recruitment",
              "Admissions",
              "Christian Distinctiveness",
            ],
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "curriculum"
    label: "Curriculum Subjects"
    folder: "content/curriculum"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Subject Name", name: "title", widget: "string" }
      - {
          label: "Key Stage",
          name: "keyStage",
          widget: "select",
          multiple: true,
          options: ["KS3", "KS4", "Sixth Form"],
        }
      - { label: "Overview", name: "body", widget: "markdown" }
      - {
          label: "Subject Overview Document (PDF)",
          name: "documentHref",
          widget: "file",
          required: false,
          media_folder: "/public/documents/curriculum",
          public_folder: "/documents/curriculum",
        }
      - {
          label: "Display Order",
          name: "order",
          widget: "number",
          required: false,
        }

  - name: "letters"
    label: "Letters Home"
    folder: "content/letters"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Year Group",
          name: "yearGroup",
          widget: "select",
          options:
            [
              "Whole School",
              "Year 7",
              "Year 8",
              "Year 9",
              "Year 10",
              "Year 11",
              "Sixth Form",
            ],
        }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - {
          label: "Letter (PDF)",
          name: "documentHref",
          widget: "file",
          media_folder: "/public/documents/letters",
          public_folder: "/documents/letters",
        }
      - { label: "Summary", name: "excerpt", widget: "text", required: false }

  - name: "policies"
    label: "Policies"
    folder: "content/policies"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Policy Name", name: "title", widget: "string" }
      - {
          label: "Category",
          name: "category",
          widget: "select",
          options:
            [
              "Safeguarding",
              "Admissions",
              "Data Protection",
              "SEND & Pupil Premium",
              "Curriculum",
              "Behaviour & Attendance",
              "Health & Safety",
              "Other",
            ],
        }
      - {
          label: "Policy Document (PDF)",
          name: "documentHref",
          widget: "file",
          media_folder: "/public/documents/policies",
          public_folder: "/documents/policies",
        }
      - {
          label: "Last Reviewed",
          name: "lastReviewed",
          widget: "datetime",
          format: "YYYY-MM-DD",
          required: false,
        }
      - {
          label: "Next Review Due",
          name: "nextReview",
          widget: "datetime",
          format: "YYYY-MM-DD",
          required: false,
        }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Term Dates"
        name: "term_dates"
        file: "content/settings/term-dates.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - label: "Dates"
            name: "dates"
            widget: "list"
            fields:
              - { label: "Term", name: "term", widget: "string" }
              - { label: "Date Range", name: "range", widget: "string" }
